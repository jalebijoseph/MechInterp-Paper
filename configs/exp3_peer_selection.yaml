# Experiment 3: orchestrator delegation, model-family bias, MACE-inspired lock-in
experiment: peer_selection
out_dir: runs
endpoints_file: configs/endpoints.yaml
orchestrator: qwen3-1.7b
orchestrator_family: qwen     # defaults to the endpoint's registry family
other_families: [llama, gemma, gpt-oss]
size_conditions: [equal, own_smaller, own_larger]
variants: [context, family, self_preference, bandit]
# Real family-bias test: own = orchestrator's family, other = another family. The
# default below is a same-family PLUMBING run (Qwen vs sampled Qwen); for the real test
# point `other` at e.g. a Llama or Gemma endpoint from configs/endpoints.yaml.
self_preference:
  own: {endpoint: qwen3-1.7b}
  other: {endpoint: qwen3-1.7b, temperature: 0.9, seed: 1}
n_seeds: 4
rounds: 12
record: {top_k: 10}
