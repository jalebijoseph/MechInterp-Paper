# Experiment 2: does the reviewer respond to a peer's intent, beyond the facts?
# Cells: {incentive, no_incentive, document} x {true, false claim}; contrasts paired by fact.
experiment: imposter
out_dir: runs
endpoints_file: configs/endpoints.yaml
agents:
  reviewer: qwen3-1.7b        # subject (recorded)
  peer: qwen3-1.7b            # author (live mode only; not recorded)
peer_mode: scripted           # scripted (matched wording) | live (no document arm)
sources: [incentive, no_incentive, document]
n_items: 60
max_new_tokens: 140
record: {top_k: 10}
# Optional NARCBench replay: honest agents re-read real collusion transcripts.
narcbench:
  source_model: qwen3_32b     # whose transcripts (qwen3_32b | gpt_oss_20b)
  tier: core
  max_scenarios: 20           # collusion + control runs
