# Experiment 4: re-run an experiment with J-space removed / edited.
# Change `base` (collab | imposter | peer_selection | tom_validation) and copy that
# experiment's keys below. Each J-space ablation is paired with a size-matched random
# control (matched_k*: removes the same amount, along a random direction).
# jspace_generated = J-space removed while writing (main); jspace_peer_span = while reading.
experiment: ablation
base: imposter
out_dir: runs
endpoints_file: configs/endpoints.yaml
interventions: [none, jspace_light, matched_k5, jspace_medium, matched_k10, jspace_heavy,
                matched_k25, jspace_generated, jspace_peer_span, suppress_words, steer_suspicion]
# --- keys for the base experiment (imposter) ---
agents: {reviewer: qwen3-1.7b, peer: qwen3-1.7b}
peer_mode: scripted
n_items: 20
max_new_tokens: 120
record: {top_k: 10}
